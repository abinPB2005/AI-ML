<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>view complaints</title>
</head>
<body>
<h1>View Complaints</h1>
<nav>
    <a href="/myapp/admin_home/">Home</a>
</nav>

<table border="2">
    <tr>
        <th>User</th>
        <th>Complaints</th>
        <th>Reply</th>
    </tr>
    {% for i in data %}
        <tr>
        <td>{{ i.User.name }}</td>
        <td>{{ i.complaint }}</td>
        <td>{{ i.reply }}</td>
        <td><a href="/myapp/reply/{{ i.id }}">reply</a></td>
        </tr>
    {% endfor %}
</table>



</body>
</html>
